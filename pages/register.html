<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Register | Digital Will Vault</title><link rel="stylesheet" href="../css/style.css"></head>
<body class="auth-page">
<div class="auth-shell">
  <a class="brand auth-brand" href="../index.html"><span class="brand-icon">▣</span> Digital Will Vault</a>
  <div class="auth-card register-card">
    <div class="auth-logo">▣</div><h1>Create an Account</h1><p>Start organizing your digital legacy.</p>
    <form onsubmit="demoRegister(event)">
      <label>Full Name<input type="text" placeholder="Enter your full name" required></label>
      <label>Email Address<input type="email" placeholder="Enter your email" required></label>
      <label>Phone Number<input type="tel" placeholder="Enter your phone number" required></label>
      <label>Password<div class="password-wrap"><input type="password" id="regPassword" placeholder="Enter your password" required><button type="button" onclick="togglePassword('regPassword')">◉</button></div></label>
      <label>Confirm Password<input type="password" placeholder="Confirm your password" required></label>
      <button class="btn btn-primary full" type="submit">Register</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>
<script src="../js/app.js"></script>
</body></html>
